# Environment for the example scripts, the experiment plotting steps and the dashboard.
#
# Deliberately NOT a workspace member: it pulls in the Makie stack, and a workspace member would put
# that in the shared Manifest so that CI and every plain `Pkg.instantiate()` paid three minutes of
# precompile for a package that never plots. This resolves on its own instead.
#
#     julia --project=examples -e 'using Pkg; Pkg.instantiate()'

[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
HEMSSimulator = "6d0dd5a4-2aa3-5676-9f1e-209ad3a36858"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[sources]
HEMSSimulator = {path = ".."}
