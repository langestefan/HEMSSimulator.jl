# ENTSOE.jl is not in the General registry yet, so the day-ahead price loader resolves straight
# from git. A URL rather than a local path so that a fresh clone and CI can resolve without a
# sibling checkout; drop the whole entry once the package is registered. To develop against a local
# checkout instead, run `Pkg.develop(path = "../EuropeanPowerSystems/ENTSOE.jl")`.
ENTSOE = {url = "https://github.com/langestefan/EntsoE.jl", rev = "code-review-fixes"}

